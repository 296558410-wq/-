    new_classification: "持仓(not 流) = PARTIALLY_ACCESSIBLE（CFTC COT 公开每周）"
    evidence: "CFTC Commitments of Traders 报告（cftc.gov，公开免费，含 disaggregated CSV + API）"
    what_is_accessible: "黄金期货投机(non-commercial) vs 商业对冲(commercial) 净持仓，周频"
    what_is_still_inaccessible: "高频 signed order flow（日内方向流仍不可得）"
