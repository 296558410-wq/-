# DECISION CONTRACT — Hermes 每轮决策输出
> 机器校验字段全集。Hermes 输出必须通过此契约(缺失/类型错 → 整轮判 INVALID_DECISION, 记 failure)。
> 所有价格单位: USD(XAUUSD)。时间: UTC ISO8601。

schema: hermes_decision_v1

required:
  - utc_ts                 # 判断时刻(UTC ISO8601)
  - symbol                 # "XAUUSD"
  - cycle                  # M15 收盘标签, 如 "2026-09-07T11:30Z"
  - market_state           # 见下方 market_state 块(来自确定性状态包, 原样透传)
  - mtf_agreement          # "agree_up|agree_down|conflict|mixed_neutral|data_gap"
  - state_summary          # 1-3 句 Hermes 对状态的综合判断(供复盘, 非触发依据)
  - m15_change             # 本 M15 相对上根的变化简述
  - opportunity            # "none|breakout|pullback|range_reversal|exhaustion|other"
  - opportunity_mechanism  # 机会机制(KU-C 引用或自由描述; none 时 = "")
  - decision               # "LONG|SHORT|WAIT"  (唯一交易判定)
  - confidence             # 0.0-1.0 (仅 decision!=WAIT 时必须; 建议均填)
  - plan_id                # 引用已注册计划; WAIT/无计划时 = null
  - answers_14             # 14 问的紧凑回答(逐条 1..14, 每条 ≤1 句, 第 11 问必含 EV 数值与成本数值)
  - cost_note              # 第 10/11 问的成本明细: spread_bps/slippage_bps/往返总 bps
  - ev_note                # 第 11 问: 数值与算式, 如 "0.9R*0.45 - 1R*0.55 - 0.12R = -0.27R → 负 → WAIT"
  - model                  # LLM 标识
  - prompt_version         # 决策 prompt 版本(可复现回溯)

market_state 块(确定性, 引擎生成后透传, Hermes 只读不改):
  - d1: {bars: N, structure, ma20_50_200, rsi14, atr, vol_state, regime, s_r: [..], note}
  - h4: {...同上}
  - h1: {...同上}
  - m15: {bars: N, last_close, last_move_bps, spread_bps_now, tick_rate, burst, note}
  - data_quality: {live_days, context_days, gaps: [..]}   # 数据完整性诚实标注

rules:
  - decision 与 plan_id 一致性: 若 plan_id 非空则该计划须已存在于 ledger(注册在前)。
  - WAIT 时必须填 answers_14[13]=="WAIT" 且给出 answers_14[14] 理由; WAIT 也完整记录(不是失败)。
  - confidence>0 时 expected 结构(见 TRADE_PLAN_CONTRACT)若 decision!=WAIT 则必填。
  - 禁止输出决定风险参数的字段(见 RISK 契约, 独立文件): Hermes 输出 risk_* 字段一律被忽略并记 warning。
