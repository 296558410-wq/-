    name: "LBMA 定盘 = IBA 电子轮次拍卖（round-based auction）"
    description: "黄金 LBMA 定盘价由 ICE Benchmark Administration 以电子拍卖形式产生：30 秒/轮，
      约十余家直接参与者提交买卖量，失衡 ≤10,000 盎司则成交，否则朝失衡方向调价进入下一轮。"
    evidence: [E2/E3, "IBA 官方机制 + WatchGold 微观结构拆解（2026-09 访问）"]
    contradictions: "无直接反证（机制描述性，非可交易主张）"
    markets: "黄金现货（伦敦 OTC）"
    conditions: "10:30 / 15:00 伦敦时间两场；依赖直接参与者提交真实订单"
    limitations: "XAUUSD 是经纪商 spot 报价（FXTM），非 LBMA 直接成员；定盘时刻的微观影响需经 feed 传导"
    xauusd_relevance: MEDIUM  # 理解价值 + 潜在定盘窗 microstructure
    data_requirement: "FXTM tick 覆盖 10:30/15:00 伦敦；事件时间表已知（固定）"
    status: EXTENSION  # 深化 RID-009

