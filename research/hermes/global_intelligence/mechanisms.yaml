    data_requirement: "需 COMEX/GLD 数据（当前未接入 → KD-U05）"
    status: NEW

  - id: MECH-03
    name: "波动率目标定仓的换手/成本幻觉（vol-targeting turnover illusion）"
    description: "用已实现方差(1/RV)做 vol-target 会产生极端杠杆与换手；其收益在计入交易成本后消失。
      平滑波动预测(变分贝叶斯)可正则化换手、恢复经济价值。"
    evidence: [E2/E3, "arxiv:2212.07288 (Smoothing volatility targeting) 158 策略实证"]
    contradictions: "见 CONTRA-01（Moreira-Muir 争议链）"
    markets: "美股因子（158 策略）"
    conditions: "月频换手；成本 14/50bp 两档"
    limitations: "美股因子证据；XAUUSD 未验证"
    xauusd_relevance: HIGH  # 直接对应 R1'-B/C 结论（机会成本>保护；C 冗余）
    data_requirement: "已有（vol 特征管线 Phase 4-6 资产可复用）"
    status: EXTENSION  # 外部印证 R1' 的"成本侵蚀"发现

