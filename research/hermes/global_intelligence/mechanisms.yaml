  - id: MECH-05
    name: "Last look + 流毒性（flow toxicity）→ 真实执行成本 > 半价差"
    description: "FX/gold 非银行流动性普遍带 last look（50-200ms 可拒单）→ 公布价差是『非对称期权』：
      流动性商赢时紧、输时拒。朴素回测用半价差，真实成本 = 成交单半价差 + 被拒单机会成本。
      你的流若系统性早于不利 mid 移动到达，流动性商会针对你加宽报价、最终降级（de-tier）。"
    evidence: [E3, "BIS 2025 Triennial Survey + FX 执行层文献（divitae 等）"]
    contradictions: "无（这是结构事实，非可交易主张）"
    markets: "FX spot / OTC 贵金属"
    conditions: "非银行流；50-200ms last look；dealer/PTF 内部化"
    limitations: "XAUUSD 零售 feed（FXTM）的 last look 具体参数未测"
    xauusd_relevance: HIGH  # 执行层（KD-O02）；直接解释 Phase 5 的『成本幻觉』
    data_requirement: "需成交级 tick + 拒单数据（当前 FXTM feed 无精确 signed flow/拒单记录 → 部分 DATA GAP）"
    status: NEW

