    description: "交易成本随波动 regime 变化（高波动期成本显著更高）；OOS 最大收益来自择时
      『波动率+交易成本』，而非择时预期收益。"
    evidence: [E2/E3, "NBER w24222 (Collin-Dufresne/Daniel/Sağlam) regime-switching + 机构真实交易成本"]
    contradictions: "无强反证；与 Merton(1980)『二阶矩比一阶矩更可估』一致"
    markets: "美股市场组合（机构交易成本数据）"
    conditions: "regime-switching 框架；state 依赖的交易速度"
    limitations: "美股；XAUUSD 未验证"
