    description: "黄金价格 = 三个物理分离市场（COMEX 期货/伦敦现货/GLD）被套利钉成一个价。
      COMEX 期货领先（尤其美国时段），现货与 GLD 跟随；EFP(cash-and-carry)是套利纽带。"
    evidence: [E2/E3, "多来源微观结构一致；2020-03 套利崩裂（EFP basis 爆裂）为压力测试实证"]
    contradictions: "双向传导（非单向因果）；领先关系随时段/流动性变化"
    markets: "黄金（COMEX/伦敦/GLD）"
    conditions: "依赖实物可运输性；交割规格匹配（400oz vs 100oz）"
    limitations: "XAUUSD 是 spot CFD/报价，非 COMEX 期货；但价格发现源头在 COMEX"
