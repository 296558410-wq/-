# ---- 30 目标模板（方法论，非已执行） ----
benchmark_template:
  target_categories:
    deep_html: ["院校课程页深层材料", "机构白皮书附录"]
    pagination: ["arxiv 作者全列表", "会议 proceedings 翻页"]
    pdf: ["论文附录含数据表", "央行工作论文 PDF"]
    attachment: ["报告附带的 .xlsx/.csv", "repo 的 data/ 压缩包"]
    github: ["README 之外看 source/tests/issues", "config 里的数据依赖"]
    citation_graph: ["反向引用 + 前向被引"]
    author_graph: ["作者主页 → 其它论文 → 机构"]
    public_api: ["GitHub API", "arxiv API", "Crossref"]
    archive: ["web.archive.org 历史版本", "SSRN 修订版"]
    counter_evidence: ["replication 失败", "后续 criticism", "retraction"]
    historical_version: ["论文 v1 vs v2 结论差异", "repo commit 历史"]
    dynamic_content: ["（不优先，最后手段）"]
  per_target_fields:
    - TARGET
    - INITIAL_DISCOVERY
    - WHY_HARD_TO_FIND
    - CRAWL_PATH
    - DEPTH_REACHED
    - SOURCES_FOUND
    - DOCUMENTS_FOUND
    - CODE_FOUND
    - DATA_FOUND
    - COUNTER_EVIDENCE_FOUND
    - TIME
    - REQUEST_COUNT
    - ACCESS_RESTRICTIONS
  honesty_rule: "每行必须真实；未执行的标 PENDING，不得编造 depth/request 数字"

# ---- 基准评分（冻结） ----
scoring:
  value_discovery: "每链是否产出新的、可追溯的 Research Intelligence（非网页计数）"
  depth: "是否越过第一层入口（≥3 层为达标）"
  traceability: "每步 URL/accessed date 可追溯"
  counter_evidence: "是否主动找到反证（高价值 claim 必需）"
  reproducibility: "代码/数据/步骤可否复现"
