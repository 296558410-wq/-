<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes AI Trader — 交易系统架构</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --fg: #e5e7eb;
    --muted: #a3adbd;
    --line: #94a3b8;
    --neutral: #334155;
    --input: #1d4ed8;
    --process: #4338ca;
    --storage: #0f766e;
    --external: #92400e;
    --risk: #991b1b;
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 22px; font-weight: 650; fill: var(--fg); }
  .sub { font-size: 13px; fill: var(--muted); }
  .label { font-size: 14px; font-weight: 600; fill: var(--fg); }
  .l2 { font-size: 12px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; rx: 10; }
  .neutral { fill: #1e293b; }
  .input { fill: #1e3a8a; }
  .process { fill: #312e81; }
  .storage { fill: #134e4a; }
  .external { fill: #78350f; }
  .risk { fill: #7f1d1d; }
  .okline { fill: #14532d; }
  .edge { stroke: #64748b; stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: #475569; stroke-width: 1; stroke-dasharray: 6 5; opacity: .8; }
  .legend { font-size: 12px; fill: var(--muted); }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b; }
    .neutral{fill:#e2e8f0}.input{fill:#bfdbfe}.process{fill:#c7d2fe}
    .storage{fill:#99f6e4}.external{fill:#fde68a}.risk{fill:#fecaca}.okline{fill:#bbf7d0}
  }
</style>
