summary:
  strongest_local_evidence:
    - "E5 CONFIRMED: activity/spread → 未来 vol（非方向, CL-01/02, M10）——本图唯一 E5 信息层"
    - "E5-负（已测空间）: 无条件方向族（M08/M09/M20 单腿 + M03 proxy 方向）"
    - "E4-负: R1'-B 无条件日级 gate（机会成本 > 保护）"
  strongest_external_counterevidence_applied:
    - "HERMES-10: vol-timing 盈利成本归零（JFE）+ 2000 后消失（Elsevier）→ M18/R1 盈利主张 WEAKENED（CONTRA-09）"
    - "Muravyev JFE 2025: 期权 IV 预测 = 借券费代理（M14）"
    - "rahulsp 2026: 跨资产 lead-lag OOS 负（M25）"
    - "Andersen-Bondarenko: VPIN 批判（M07）"
    - "arxiv 2512.18648 / HBS Rethinking Volume / arxiv 2507.22712: volume 归一化、毛量≠净流、OBI flicker（M03/M10 proxy 警示）"
  counting_caveat: "外部文献多为他市场且相互引用成链——计入的独立线数保守偏低；本地线虽双源双期, 但单团队单方法族 → 计 1 条。任何 'n 篇论文支持' 表述一律按独立线折算。"
  verdict: "无任何机制在当前可及性下达到 E6（XAUUSD OOS+成本+执行后）。'无当前可及机制有足够证据进入立即研究' 对盈利 edge 层成立；对信息层（M10 E5）与中间层候选（M17/M18 信息用法）不成立——两者是 RESEARCH 候选而非 PROFIT 证据。"
